# Code-quality settings for the Shorts app only. Each tool finds this file
# when it is run on shorts/ (see shorts/QUALITY.md for the commands).

[tool.black]
line-length = 79
extend-exclude = "migrations/"

[tool.isort]
profile = "black"
line_length = 79
known_first_party = ["accounts", "announcements", "course", "shorts"]
extend_skip = ["migrations"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
strict = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/.."
explicit_package_bases = true
exclude = ["migrations/"]
untyped_calls_exclude = ["accounts", "announcements", "mutagen"]

[[tool.mypy.overrides]]
module = ["mutagen.*", "storages.*"]
ignore_missing_imports = true

# Other apps are imported (User, Tag) but are not part of this check.
[[tool.mypy.overrides]]
module = [
    "accounts.*",
    "announcements.*",
    "course.*",
    "calendar_app.*",
    "notifications.*",
    "academic_hub.*",
]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "academic_hub.settings"

[tool.pylint.main]
load-plugins = ["pylint_django"]
django-settings-module = "academic_hub.settings"
ignore = ["migrations"]

[tool.pylint.basic]
# Test names already say what they check; helpers starting with _ are
# private. Everything else needs a docstring.
no-docstring-rgx = "^(_|test_|setUp|tearDown)"

[tool.pylint.format]
max-line-length = 79

[tool.coverage.run]
source = ["shorts"]
omit = ["shorts/migrations/*", "shorts/tests/*"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 95
