# Code-quality checks for the Shorts app. Runs on every pull request that
# touches shorts/, and on pushes to main, so a failing check blocks a merge
# once "Shorts quality" is made a required check in the branch settings.
name: Shorts quality

on:
  pull_request:
    paths:
      - "source/academic_hub/shorts/**"
      - ".github/workflows/shorts-quality.yml"
  push:
    branches: [main]
    paths:
      - "source/academic_hub/shorts/**"
      - ".github/workflows/shorts-quality.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/academic_hub
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      SHORTS_STORAGE: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt -r shorts/requirements-dev.txt
      - name: Format (black, isort)
        run: |
          black --check --config shorts/pyproject.toml shorts
          isort --check-only --settings-path shorts/pyproject.toml shorts
      - name: Lint (pylint)
        run: pylint --rcfile shorts/pyproject.toml --fail-under 9.5 shorts
      - name: Types (mypy)
        run: mypy --config-file shorts/pyproject.toml shorts
      - name: Complexity (radon, xenon)
        run: |
          radon cc -s -a -e "shorts/migrations/*" shorts
          radon mi -s -e "shorts/migrations/*" shorts
          xenon --max-absolute B --max-modules A --max-average A \
            -e "shorts/migrations/*" shorts
      - name: Security (bandit)
        run: bandit -q -r shorts -x shorts/tests,shorts/migrations
      - name: Tests and coverage
        run: |
          coverage run --rcfile shorts/pyproject.toml \
            manage.py test shorts --noinput
          coverage report --rcfile shorts/pyproject.toml
